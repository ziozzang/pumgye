syntax = "proto3";
package hangang.pumgye.v1;
import "gateway.proto";
service Authorization { rpc Decide(DecisionRequest) returns (DecisionReply); }
// The authenticated enforcement caller owns identity and network evidence.
// Raw application claims must never be copied here without verification.
message DecisionRequest {
  uint64 request_id = 1;
  uint64 minimum_revision = 2;
  bytes ip = 3; // Exactly 4 or 16 network-order bytes.
  uint32 aal = 4;
  GuardEvidence guard = 5;
  string service_id = 6;
  string subject = 7;
  string permission = 8;
  string information_class = 9;
}
enum GuardEvidence {
  GUARD_UNSPECIFIED = 0;
  GUARD_ENFORCED_ALLOW = 1;
  GUARD_DENY = 2;
  GUARD_OBSERVE = 3;
  GUARD_UNAVAILABLE = 4;
}
message DecisionReply {
  uint64 request_id = 1;
  uint64 revision = 2;
  Verdict verdict = 3;
  uint32 native_reason = 4;
  uint32 cache_ttl_ms = 5; // Zero: do not cache the decision.
}
enum Verdict {
  VERDICT_UNSPECIFIED = 0; // Must never grant permission.
  VERDICT_ALLOW = 1;
  VERDICT_DENY = 2;
  VERDICT_UNAVAILABLE = 3;
}

service ResourceAuthorization { rpc Decide(ResourceDecisionRequest) returns (ResourceDecisionReply); }
// Classification and action mapping come from the authoritative resource catalog.
message ResourceDecisionRequest { uint64 request_id = 1; uint64 minimum_revision = 2; bytes ip = 3; uint32 aal = 4; GuardEvidence guard = 5; string resource = 6; string action = 7; string subject = 8; string service_id = 9; }
message ResourceDecisionReply { uint64 request_id = 1; uint64 revision = 2; Verdict verdict = 3; string reason = 4; uint32 cache_ttl_ms = 5; }

// The canonical Hopae generated context is shared without copying or JSON parsing.
service AuthenticatedResourceAuthorization { rpc Decide(AuthenticatedResourceRequest) returns (AuthenticatedResourceReply); }
message AuthenticatedResourceRequest { uint64 request_id = 1; uint64 minimum_revision = 2; bytes ip = 3; string resource = 4; string action = 5; hangang.hopae.v1.AuthenticationReceiptContext context = 6; bytes receipt = 7; bytes request_sha256 = 8; NativeRouteReference route = 9; }
message AuthenticatedResourceReply { uint64 request_id = 1; uint64 revision = 2; uint64 network_revision = 3; Verdict verdict = 4; uint32 cache_ttl_ms = 5; bool route_observed = 6; }

// Opaque native reference; destination is a digest, never a caller-selected URL.
message NativeRouteReference { bytes reference = 1; bytes destination_sha256 = 2; }

// Separate issuance endpoint: requires native route and plan owners; never signs caller state.
service ProjectionPermits { rpc Issue(AuthenticatedResourceRequest) returns (ProjectionPermitReply); }
message PermitBinding { bytes authentication_receipt_sha256 = 1; string decision_ref = 2; string resource = 3; string action = 4; string authority_epoch = 5; uint64 catalog_revision = 6; uint64 policy_revision = 7; uint64 network_revision = 8; uint64 route_revision = 9; uint64 plan_revision = 10; }
message ProjectionPermitReply { uint64 request_id = 1; hangang.hopae.v1.AuthenticationReceiptContext context = 2; PermitBinding binding = 3; bytes receipt = 4; uint32 cache_ttl_ms = 5; }

[package]
name = "pumgye-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Pumgye policy authority and decision server"

[[bin]]
name = "pumgye"
path = "src/main.rs"

[features]
default = []
# Foundation only: no endpoint or permit signing is enabled by this feature.
observed-authentication = ["hopae-grpc/native-client"]

[dependencies]
hangang-route-grpc = { git = "https://github.com/ziozzang/hangang", rev = "dfc099ea763650f98b31110f0720cf3d9042f3ec" }
guard-grpc = { git = "https://github.com/ziozzang/sumunjang", rev = "1f70428e9481654845a696cf30cdb917a6aef009" }
hopae-grpc = { git = "https://github.com/ziozzang/hopae", rev = "c7ddcf2bb0d12adff7db06e7df178b88b9c5062f" }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
base64 = "0.22"
zeroize = "1"
hangang-runtime = { git = "https://github.com/ziozzang/hangang-runtime", rev = "0cdbd1660cefe46eed8bab3c0deb1b62c560ecf6" }
pumgye-grpc = { path = "../pumgye-grpc" }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
pumgye-core = { path = "../pumgye-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.10"

pumgye-protocol = { path = "../pumgye-protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
